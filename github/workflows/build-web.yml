name: Build Web to APK

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL website'
        required: true
      app_name:
        description: 'Nama aplikasi'
        required: false
        default: 'MyApp'
      package_id:
        description: 'Package ID'
        required: false
        default: 'com.example.myapp'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: npx cap init "${{ inputs.app_name }}" "${{ inputs.package_id }}" --web-dir=www

      - name: Create web assets
        run: |
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
            <style>*{margin:0;padding:0}html,body,iframe{width:100%;height:100%;border:none}</style>
          </head>
          <body>
            <iframe src="${{ inputs.target_url }}" allowfullscreen></iframe>
          </body>
          </html>
          EOF

      - name: Add Android & sync
        run: |
          npx cap add android
          npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: web-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
