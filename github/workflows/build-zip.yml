name: Build ZIP to APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL download ZIP'
        required: true
      project_type:
        description: 'Tipe project'
        required: true
        default: 'flutter'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP
        run: |
          curl -L -o project.zip "${{ inputs.zip_url }}"
          unzip -o project.zip -d project

      - name: Setup Flutter
        if: inputs.project_type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Build Flutter APK
        if: inputs.project_type == 'flutter'
        working-directory: project
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        if: inputs.project_type == 'flutter'
        with:
          name: zip-flutter-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
